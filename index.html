<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Text Extractor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 1.5rem;
    }
    h1 {
      color: #38bdf8;
      font-size: 1.5rem;
      margin-bottom: 1.2rem;
    }
    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
      font-size: 1rem;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #0ea5e9;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
    }
    button:disabled { background: #475569; }
    #status {
      margin: 16px 0;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }
    .loading { display: block !important; background: #1e3a5f; color: #7dd3fc; }
    .error { display: block !important; background: #450a0a; color: #fca5a5; }
    .success { display: block !important; background: #052e16; color: #86efac; }
    #result {
      margin-top: 20px;
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 65vh;
      overflow-y: auto;
      line-height: 1.6;
      display: none;
    }
  </style>
</head>
<body>
  <h1>URL Text Extractor</h1>

  <input type="url" id="url" placeholder="Paste any webpage URL here..." />
  <button id="btn" onclick="extract()">Extract Text</button>

  <div id="status"></div>
  <div id="result"></div>

  <script>
    async function extract() {
      const url = document.getElementById("url").value.trim();
      const status = document.getElementById("status");
      const result = document.getElementById("result");
      const btn = document.getElementById("btn");

      if (!url) {
        alert("Please enter a URL");
        return;
      }

      btn.disabled = true;
      status.className = "loading";
      status.textContent = "Extracting text... please wait";
      result.style.display = "none";

      try {
        // Calls your own Vercel API
        const response = await fetch(`/api/extract?url=${encodeURIComponent(url)}`);
        const data = await response.json();

        if (!data.success) {
          throw new Error(data.error || "Extraction failed");
        }

        status.className = "success";
        status.textContent = `Success! ${data.length} characters extracted`;
        result.style.display = "block";
        result.textContent = data.text;

      } catch (err) {
        status.className = "error";
        status.textContent = "Error: " + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
  </html>
